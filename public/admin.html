<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your inbox</title><style>*{box-sizing:border-box}body{background:#f9f7f3;color:#252622;font:16px/1.5 system-ui;margin:0}main{max-width:600px;margin:auto;padding:28px 20px}h1{font:normal 48px Georgia}section{background:#fff;border:1px solid #e2dfd8;border-radius:14px;padding:20px}input,button{font:inherit;padding:14px;border-radius:8px}input{width:100%;border:1px solid #cac8c1}button{background:#314b3a;color:#fff;border:0;margin:12px 0;cursor:pointer}.card{border-top:1px solid #ddd;padding:18px 0;overflow-wrap:anywhere;white-space:pre-wrap}.meta{font-size:13px;color:#666}</style><main><h1>Your inbox.</h1><section><form id="login"><label for="password">Inbox password</label><input id="password" type="password" autocomplete="current-password" required><button>Open inbox</button></form><p id="status" role="status"></p><div id="messages"></div></section></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let s=document.querySelector('#status'),list=document.querySelector('#messages');s.textContent='Loading…';try{let r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value}),cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Incorrect password.':'Could not load inbox.');let data=await r.json();list.replaceChildren();for(let m of data){let card=document.createElement('div'),text=document.createElement('div'),meta=document.createElement('p');card.className='card';meta.className='meta';text.textContent=m.message;meta.textContent=[new Date(m.time).toLocaleString(),m.screen&&'Screen: '+m.screen,m.phone&&'Phone: '+m.phone,m.location&&'Location: '+m.location].filter(Boolean).join(' · ');card.append(text,meta);list.append(card)}s.textContent=data.length?'':'No messages yet.'}catch(err){s.textContent=err.message}};</script></html>
