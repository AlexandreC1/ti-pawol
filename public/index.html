<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Ti Pawòl</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#252a24;font:16px/1.5 system-ui,sans-serif}main{max-width:570px;margin:auto;padding:28px 20px 60px}header{font-weight:750;letter-spacing:.04em;color:#486554;font-size:14px}h1{font:400 clamp(40px,10vw,60px)/1.08 Georgia,serif;letter-spacing:-.03em;margin:42px 0 16px}p{color:#60645c}section{background:white;border:1px solid #e4e4dc;border-radius:16px;padding:22px;margin-top:28px}label{display:block;font-weight:650;margin:17px 0 8px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #c9cdc4;border-radius:9px;background:#fff;color:#252a24}textarea{min-height:140px;resize:vertical}button{background:#345b45;color:white;border:0;border-radius:9px;min-height:50px;padding:12px 18px;font-weight:700;cursor:pointer;width:100%;margin-top:16px}button.secondary{color:#345b45;background:#edf3ed}button:disabled{opacity:.6}small{color:#666}a{color:#345b45;overflow-wrap:anywhere}.linkbox{margin:20px 0;overflow-wrap:anywhere}.message{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #e4e4dc;padding:18px 0}.time{font-size:12px;color:#777;margin-top:6px}#status{min-height:1.5em;color:#526c58}footer{margin-top:30px;font-size:13px;color:#777} @media(min-width:600px){main{padding:48px 24px 70px}section{padding:28px}button{width:auto;min-width:160px}}</style></head><body><main><header>TI PAWÒL ✳</header><div id="app"></div><footer>Fèt pou ti pale ki soti nan kè.</footer></main><script>
const $=s=>document.querySelector(s),app=$('#app');const dict={ht:{default:'Gen yon bagay ou ta renmen di m? Mwen la pou m koute w.',createTitle:'Ann pale ak kè nou.',intro:'Kreye yon ti espas kote zanmi w ka pataje sa yo gen nan kè yo.',language:'Lang pou mesaj la',prompt:'Kisa ou vle mande?',create:'Kreye lyen mwen',creating:'Yon ti moman…',ready:'Lyen ou a pare!',share:'Voye lyen sa a bay zanmi w',private:'Bwat mesaj ou',privateHint:'Kenbe lyen sa a pou ou sèlman. Nenpòt moun ki genyen li ka li mesaj yo.',copy:'Kopye',copied:'Kopye!',open:'Louvri bwat mwen',write:'Mesaj ou',placeholder:'Ekri sa w gen nan kè w…',send:'Voye mesaj',sent:'Mèsi paske ou pataje sa avè m 💛',again:'Voye yon lòt mesaj',inbox:'Ti mesaj pou ou.',empty:'Pa gen mesaj ankò. Pataje lyen ou a ak zanmi w.',refresh:'Rafrechi',error:'Sa pa mache kounye a. Tanpri eseye ankò.'},en:{default:'Is there something you’ve been meaning to tell me? I’m here to listen.',createTitle:'A little space to talk.',intro:'Make a space for your friends to share what’s on their minds.',language:'Message language',prompt:'What would you like to ask?',create:'Create my link',creating:'One moment…',ready:'Your link is ready!',share:'Send this link to your friends',private:'Your inbox',privateHint:'Keep this link private. Anyone with it can read your messages.',copy:'Copy',copied:'Copied!',open:'Open my inbox',write:'Your message',placeholder:'Whatever you want to say…',send:'Send message',sent:'Thanks for sharing 💛',again:'Send another message',inbox:'Notes for you.',empty:'No messages yet. Share your link with your friends.',refresh:'Refresh',error:'Something went wrong. Please try again.'},fr:{default:'Il y a quelque chose que tu aimerais me dire ? Je suis là pour t’écouter.',createTitle:'Un espace pour se parler.',intro:'Crée un petit espace où tes amis peuvent se confier.',language:'Langue du message',prompt:'Que veux-tu demander ?',create:'Créer mon lien',creating:'Un instant…',ready:'Ton lien est prêt !',share:'Envoie ce lien à tes amis',private:'Ta boîte de réception',privateHint:'Garde ce lien pour toi. Toute personne qui le possède peut lire tes messages.',copy:'Copier',copied:'Copié !',open:'Ouvrir ma boîte',write:'Ton message',placeholder:'Écris ce que tu as sur le cœur…',send:'Envoyer',sent:'Merci de partager 💛',again:'Envoyer un autre message',inbox:'Des mots pour toi.',empty:'Pas encore de messages. Partage ton lien avec tes amis.',refresh:'Actualiser',error:'Un problème est survenu. Réessaie.'},es:{default:'¿Hay algo que quieras decirme? Estoy aquí para escucharte.',createTitle:'Un espacio para hablar.',intro:'Crea un espacio para que tus amigos compartan lo que piensan.',language:'Idioma del mensaje',prompt:'¿Qué quieres preguntar?',create:'Crear mi enlace',creating:'Un momento…',ready:'¡Tu enlace está listo!',share:'Envía este enlace a tus amigos',private:'Tu bandeja',privateHint:'Guarda este enlace. Quien lo tenga puede leer tus mensajes.',copy:'Copiar',copied:'¡Copiado!',open:'Abrir mi bandeja',write:'Tu mensaje',placeholder:'Escribe lo que quieras decir…',send:'Enviar mensaje',sent:'Gracias por compartir 💛',again:'Enviar otro mensaje',inbox:'Mensajes para ti.',empty:'Aún no hay mensajes. Comparte tu enlace con tus amigos.',refresh:'Actualizar',error:'Algo salió mal. Inténtalo de nuevo.'}};let lang='ht',t=dict.ht;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const analyticsText={ht:{notice:'Vizit ak kalite aparèy yo konte.',title:'Aktivite',visits:'Vizit',messages:'Mesaj',mobile:'Telefòn',tablet:'Tablèt',desktop:'Òdinatè',unknown:'Lòt'},en:{notice:'Visits and device types are counted.',title:'Activity',visits:'Visits',messages:'Messages',mobile:'Mobile',tablet:'Tablet',desktop:'Desktop',unknown:'Other'},fr:{notice:'Les visites et types d’appareils sont comptabilisés.',title:'Activité',visits:'Visites',messages:'Messages',mobile:'Mobile',tablet:'Tablette',desktop:'Ordinateur',unknown:'Autre'},es:{notice:'Se cuentan las visitas y los tipos de dispositivo.',title:'Actividad',visits:'Visitas',messages:'Mensajes',mobile:'Móvil',tablet:'Tableta',desktop:'Ordenador',unknown:'Otro'}};const opts=()=>['ht','en','fr','es'].map((l,i)=>`<option value="${l}" ${l===lang?'selected':''}>${['Kreyòl ayisyen','English','Français','Español'][i]}</option>`).join('');function setup(){t=dict[lang];document.documentElement.lang=lang;app.innerHTML=`<h1>${t.createTitle}</h1><p>${t.intro}</p><section><form id="create"><label for="lang">${t.language}</label><select id="lang">${opts()}</select><label for="prompt">${t.prompt}</label><textarea id="prompt" maxlength="300" required>${esc(t.default)}</textarea><button>${t.create}</button><p id="status" role="status"></p></form></section>`;$('#lang').onchange=e=>{let old=$('#prompt').value,wasDefault=old===t.default;lang=e.target.value;let next=dict[lang];setup();if(!wasDefault)$('#prompt').value=old};$('#create').onsubmit=async e=>{e.preventDefault();let button=e.target.querySelector('button');button.disabled=true;$('#status').textContent=t.creating;try{let r=await fetch('/api/boxes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang,prompt:$('#prompt').value})});if(!r.ok)throw Error();let {id,key}=await r.json();let share=location.origin+'/?box='+id,privateLink=location.origin+'/?inbox='+id+'#'+key;localStorage.setItem('tipawol-'+id,key);app.innerHTML=`<h1>${t.ready}</h1><section><div class="linkbox"><strong>${t.share}</strong><p><a id="share" href="${share}">${share}</a></p><button id="copy" class="secondary">${t.copy}</button></div><div class="linkbox"><strong>${t.private}</strong><p>${t.privateHint}</p><p><a id="inbox" href="${privateLink}">${t.open}</a></p></div></section>`;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(share);$('#copy').textContent=t.copied}catch{}}}catch{$('#status').textContent=t.error;button.disabled=false}}}async function showBox(id){try{let r=await fetch('/api/boxes?id='+encodeURIComponent(id));if(!r.ok)throw Error();let box=await r.json();lang=box.lang;t=dict[lang]||dict.ht;document.documentElement.lang=lang;let ua=navigator.userAgent,device=/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)?'tablet':/Mobi|iPhone|Android/i.test(ua)?'mobile':'desktop';fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,device})}).catch(()=>{});app.innerHTML=`<h1>${esc(box.prompt)}</h1><p><small>${analyticsText[lang].notice}</small></p><section><form id="messageForm"><label for="message">${t.write}</label><textarea id="message" maxlength="3000" required placeholder="${t.placeholder}"></textarea><button>${t.send}</button><p id="status" role="status"></p></form></section>`;$('#messageForm').onsubmit=async e=>{e.preventDefault();let button=e.target.querySelector('button');button.disabled=true;try{let r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,message:$('#message').value})});if(!r.ok)throw Error();e.target.innerHTML=`<p>${t.sent}</p><button type="button" class="secondary" id="again">${t.again}</button>`;$('#again').onclick=()=>showBox(id)}catch{$('#status').textContent=t.error;button.disabled=false}}}catch{app.innerHTML='<p>Link unavailable.</p>'}}async function showInbox(id){let key=location.hash.slice(1)||localStorage.getItem('tipawol-'+id);if(!key){app.textContent='Private inbox link is incomplete.';return}try{let b=await fetch('/api/boxes?id='+encodeURIComponent(id));let box=await b.json();lang=box.lang;t=dict[lang]||dict.ht;app.innerHTML=`<h1>${t.inbox}</h1><section><h2>${analyticsText[lang].title}</h2><p id="stats">...</p><p id="status">...</p><div id="list"></div><button class="secondary" id="refresh">${t.refresh}</button></section>`;async function refresh(){try{let r=await fetch('/api/inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,key})});if(!r.ok)throw Error();let data=await r.json();$('#status').textContent=data.length?'':t.empty;try{let sr=await fetch('/api/stats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,key})});if(!sr.ok)throw Error();let stats=await sr.json(),w=analyticsText[lang];$('#stats').textContent=w.visits+': '+stats.visits+' · '+w.messages+': '+data.length+' | '+['mobile','tablet','desktop','unknown'].map(k=>w[k]+': '+stats.devices[k]).join(' · ')}catch{$('#stats').textContent='—'}let list=$('#list');list.replaceChildren();for(let m of data){let card=document.createElement('div'),txt=document.createElement('div'),time=document.createElement('div');card.className='message';time.className='time';txt.textContent=m.message;time.textContent=new Date(m.time).toLocaleString();card.append(txt,time);list.append(card)}}catch{$('#status').textContent=t.error}}$('#refresh').onclick=refresh;await refresh()}catch{app.textContent='Inbox unavailable.'}}let q=new URLSearchParams(location.search);if(q.has('box'))showBox(q.get('box'));else if(q.has('inbox'))showInbox(q.get('inbox'));else setup();
</script></body></html>
